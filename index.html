
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lots of Love 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: radial-gradient(circle, #3b102d, #10000e 75%);
    font-family: "Segoe UI", sans-serif;
    color: white;
}

.card {
    text-align: center;
    padding: 35px 20px;
    animation: appear 1.5s ease;
}

.heart {
    position: relative;
    width: 120px;
    height: 120px;
    background: #ff2f92;
    transform: rotate(-45deg);
    margin: 50px auto 65px;
    animation: heartbeat 1.1s infinite;
    box-shadow: 0 0 25px #ff2f92,
                0 0 60px #ff2f92,
                0 0 100px #ff2f92;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    background: #ff2f92;
    border-radius: 50%;
}

.heart::before {
    top: -60px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 60px;
}

h1 {
    font-size: clamp(23px, 5vw, 38px);
    color: #ff83c0;
    text-shadow: 0 0 15px #ff2f92;
    margin-bottom: 15px;
    letter-spacing: 1px;
}

p {
    font-size: 20px;
    color: #ffd6e9;
    letter-spacing: 2px;
}

.love {
    margin-top: 14px;
    font-size: 25px;
    color: #ff71b8;
    animation: glow 2s infinite alternate;
}

.sparkle {
    position: absolute;
    color: #ffb6d9;
    font-size: 25px;
    animation: float 4s infinite ease-in-out;
}

.s1 { top: 12%; left: 15%; }
.s2 { top: 20%; right: 15%; animation-delay: 1s; }
.s3 { bottom: 18%; left: 20%; animation-delay: 2s; }
.s4 { bottom: 12%; right: 20%; animation-delay: .5s; }

@keyframes heartbeat {
    0%, 100% { transform: rotate(-45deg) scale(1); }
    50% { transform: rotate(-45deg) scale(1.12); }
}

@keyframes glow {
    from { text-shadow: 0 0 5px #ff2f92; }
    to { text-shadow: 0 0 25px #ff2f92, 0 0 40px #ff2f92; }
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-25px) rotate(15deg); }
}

@keyframes appear {
    from { opacity: 0; transform: scale(.7); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="sparkle s1">✧</div>
<div class="sparkle s2">♡</div>
<div class="sparkle s3">✦</div>
<div class="sparkle s4">✨</div>

<div class="card">
    <div class="heart"></div>

    <h1>FUCK YOU BITCH 😻</h1>

    <p>Just kidding... maybe 💋</p>

    <div class="love">LOTS OF LOVE 💗</div>
</div>

</body>
  </html>
